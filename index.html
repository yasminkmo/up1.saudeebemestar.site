<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oferta Especial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    background: #0f0f0f;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }

  .header {
    text-align: center;
    max-width: 600px;
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 22px;
    line-height: 1.3;
    font-weight: 700;
    color: #ffffff;
  }

  .header h1 span {
    color: #ff5c5c;
  }

  .header p {
    margin-top: 8px;
    font-size: 15px;
    color: #cccccc;
  }

  /* ===================== SLOT DO VÍDEO VTURB ===================== */
  .video-wrapper {
    width: 100%;
    max-width: 600px;
    margin: 20px 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  /*
    COLE AQUI DENTRO O EMBED DA VTURB (div/script fornecido pela plataforma).
    Exemplo de estrutura que a VTurb costuma gerar:

    <vturb-smartplayer id="vid-xxxxxxxx" style="display:block;margin:0 auto;width:100%;"></vturb-smartplayer>
    <script type="text/javascript" src="https://scripts.converteai.net/xxxx/players/xxxx/player.js" async></script>
  */
  #vturb-embed-slot {
    width: 100%;
  }
  /* =================================================================== */

  .trust-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    font-size: 12px;
    color: #888888;
  }

  /* ===================== BOTÃO DE UPSELL ===================== */
  .cta-section {
    width: 100%;
    max-width: 600px;
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .upsell-sub {
    font-size: 13px;
    color: #999999;
    text-align: center;
  }
  /* =================================================================== */

  /* ===================== TIMER DE LIBERAÇÃO DO BOTÃO ===================== */
  .cta-section {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity 0.6s ease;
    margin-top: 0 !important;
  }

  .cta-section.liberado {
    opacity: 1;
    max-height: 1000px;
    pointer-events: auto;
    margin-top: 24px !important;
  }
  /* =================================================================== */
</style>
</head>
<body>

  <div class="header">
    <h1>Sua compra foi <span>confirmada</span>. Assista até o final.</h1>
    <p>Antes de liberar seu acesso, veja essa mensagem importante.</p>
  </div>

  <!-- ===================== ÁREA DO VÍDEO (VTURB) ===================== -->
  <div class="video-wrapper">
    <div id="vturb-embed-slot">
      <vturb-smartplayer id="vid-6a8527ce5811227e10db7c08" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 177.77777777777777% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
      <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/8374fd29-86de-48bc-960b-6d93c00208eb/players/6a8527ce5811227e10db7c08/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
    </div>
  </div>
  <!-- =================================================================== -->

  <div class="cta-section">

    <!-- ===================== BOTÃO DE UPSELL (KIWIFY) ===================== -->
    <div style="text-align:center" id="kiwify-upsell-YpeZHfO" data-upsell-url="https://obrigado.saudeebemestar.site/" data-downsell-url="https://obrigado.saudeebemestar.site/">
      <button id="kiwify-upsell-trigger-YpeZHfO" style="background-color:#2ECC70;padding:12px 16px;cursor:pointer;color:#FFFFFF;font-weight:600;border-radius:4px;border:1px solid #2ECC70;font-size:20px;">QUERO O PROTOCOLO</button>
      <div id="kiwify-upsell-cancel-trigger-YpeZHfO" style="margin-top:1rem;cursor:pointer;font-size:16px;text-decoration:underline;font-family:sans-serif;">.</div>
    </div>

    <p class="upsell-sub">🔒 Compra 100% segura · Acesso imediato</p>

  </div>

  <div class="trust-row">
    <span>✔️ Pagamento protegido</span>
  </div>

  <script src="https://snippets.kiwify.com/upsell/upsell.min.js"></script>

  <!-- ===================== TIMER: LIBERA BOTÃO APÓS 1:30 ===================== -->
  <script>
    // Tempo em segundos até o botão aparecer (90 = 1:30)
    var TEMPO_LIBERACAO = 90;

    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var cta = document.querySelector('.cta-section');
        if (cta) {
          cta.classList.add('liberado');
          cta.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, TEMPO_LIBERACAO * 1000);
    });
  </script>
  <!-- =================================================================== -->

</body>
</html>
